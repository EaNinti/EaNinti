<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ea Ninti Enterprises - Operations Console</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #0b3c5d;
            --secondary-color: #328cc1;
            --accent-color: #d9b310;
            --bg-color: #f5f7fa;
            --text-color: #1d2731;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }

        /* Layout Styles */
        #sidebar { width: 260px; background-color: var(--primary-color); color: white; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        #sidebar h2 { font-size: 1.1rem; margin-bottom: 20px; border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; text-align: center; }
        .nav-btn { background: none; border: none; color: white; text-align: left; padding: 12px; font-size: 1rem; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--secondary-color); }
        
        #main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* UI Components */
        h1 { margin-bottom: 20px; color: var(--primary-color); }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary-color); color: white; }
        tr:hover { background-color: #f1f1f1; }

        /* Forms & Interactive Items */
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: 600; font-size: 0.9rem; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; width: 100%; }
        button.btn-primary { background-color: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.btn-primary:hover { background-color: var(--secondary-color); }
        
        /* Multi-select box for technicians */
        .multi-select-box { max-height: 120px; overflow-y: auto; border: 1px solid #ccc; padding: 8px; border-radius: 4px; background: #fff; }
        .multi-select-option { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; cursor: pointer; }
        .multi-select-option input { width: auto; }

        /* Modals */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index: 1000; }
        .modal-content { background:white; padding:30px; border-radius:8px; text-align:center; position:relative; max-width: 400px; width: 90%; }
        .close-modal { position:absolute; top:10px; right:15px; font-size:1.5rem; cursor:pointer; }
        
        /* Copy Link Layout */
        .link-share-box { margin-top: 15px; background: #eef5f9; padding: 10px; border-radius: 4px; display: flex; gap: 5px; align-items: center; }
        .link-share-box input { font-size: 0.85rem; padding: 6px; background: #fff; }

        /* Technician/Mobile Layout Overrides */
        body.mobile-mode #sidebar { display: none; }
        body.mobile-mode #main-content { padding: 15px; }
        .tech-only { display: none; }
        body.mobile-mode .tech-only { display: block; }
        body.mobile-mode .admin-only { display: none; }
    </style>
</head>
<body>

    <div id="sidebar" class="admin-only">
        <h2>Ea Ninti Enterprises</h2>
        <button class="nav-btn active" onclick="switchView('dashboard-view')">📋 Job Dashboard</button>
        <button class="nav-btn" onclick="switchView('create-job-view')">➕ Create Job Card</button>
        <button class="nav-btn" onclick="switchView('settings-view')">⚙️ Settings & Rates</button>
    </div>

    <div id="main-content">
        
        <div id="dashboard-view" class="view-section active admin-only">
            <h1>Marine Operations Dashboard</h1>
            <div class="card">
                <h3>Active Deployment Cards</h3>
                <table id="jobs-table">
                    <thead>
                        <tr>
                            <th>Job ID</th>
                            <th>Boat Name</th>
                            <th>Marina / Location</th>
                            <th>Assigned Techs</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="jobs-list-body">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="create-job-view" class="view-section admin-only">
            <h1>Create Job Card</h1>
            <div class="card" style="max-width: 600px;">
                <form id="job-form" onsubmit="createNewJob(event)">
                    <div class="form-group">
                        <label>Boat Name</label>
                        <input type="text" id="form-boat" required placeholder="e.g. Sea Voyager">
                    </div>
                    <div class="form-group">
                        <label>Marina / Vessel Location</label>
                        <input type="text" id="form-location" required placeholder="e.g. Marina & Slip Location">
                    </div>
                    <div class="form-group">
                        <label>Client Contact Number</label>
                        <input type="text" id="form-client-phone" required placeholder="e.g. Client Phone Number">
                    </div>
                    <div class="form-group">
                        <label>Assign Technicians (Select All That Apply)</label>
                        <div class="multi-select-box" id="form-tech-checkboxes">
